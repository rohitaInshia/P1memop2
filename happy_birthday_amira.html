
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Happy Birthday Amira Zainab!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

  body {
    margin: 0; padding: 0;
    background: #ffe4ec;
    font-family: 'Pacifico', cursive;
    overflow-x: hidden;
    text-align: center;
    color: #d6336c;
  }

  h1 {
    margin-top: 50px;
    font-size: 3.5rem;
    text-shadow: 2px 2px 6px #f48fb1;
  }

  button {
    margin: 40px auto;
    padding: 15px 30px;
    font-size: 1.3rem;
    background: #f48fb1;
    border: none;
    border-radius: 30px;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 12px #d81b60;
    transition: background 0.3s ease;
  }
  button:hover {
    background: #d81b60;
  }

  #surprise {
    margin-top: 20px;
    position: relative;
    min-height: 400px;
  }

  /* Cake */
  .cake {
    position: relative;
    margin: 0 auto;
    width: 250px;
    height: 250px;
    background: linear-gradient(180deg, #ffcee4 0%, #ff81a9 100%);
    border-radius: 0 0 50px 50px;
    box-shadow: 0 10px 15px #d94e7f;
    opacity: 0;
    transform: translateY(50px);
    transition: all 1s ease;
  }
  .cake.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Candle */
  .candle {
    position: absolute;
    top: -60px;
    left: 110px;
    width: 30px;
    height: 60px;
    background: #ff6f91;
    border-radius: 10px;
    box-shadow: inset 0 0 8px #ffa5b1;
  }
  .flame {
    position: absolute;
    top: -30px;
    left: 7px;
    width: 15px;
    height: 20px;
    background: radial-gradient(circle at center, #ffec99 0%, #ffb347 100%);
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    animation: flicker 1.5s infinite alternate;
  }

  @keyframes flicker {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-5px) scale(1.1); opacity: 0.8; }
  }

  /* Balloons */
  .balloon {
    position: fixed;
    bottom: -100px;
    width: 50px;
    height: 70px;
    background: #ff6f91;
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    opacity: 0.9;
    animation: rise 6s linear forwards;
  }
  .balloon:nth-child(1) { left: 20%; animation-delay: 0s; background: #ff6f91;}
  .balloon:nth-child(2) { left: 35%; animation-delay: 1.5s; background: #f48fb1;}
  .balloon:nth-child(3) { left: 50%; animation-delay: 3s; background: #f06292;}
  .balloon:nth-child(4) { left: 65%; animation-delay: 4.5s; background: #ec407a;}
  .balloon:nth-child(5) { left: 80%; animation-delay: 6s; background: #d81b60;}

  @keyframes rise {
    0% { bottom: -100px; opacity: 0; }
    10% { opacity: 1;}
    100% { bottom: 110vh; opacity: 0;}
  }

  /* Flowers */
  .flower {
    position: fixed;
    width: 30px; height: 30px;
    background: pink;
    border-radius: 50%;
    box-shadow:
      10px 0 0 #ff80ab,
      0 10px 0 #ff80ab,
      -10px 0 0 #ff80ab,
      0 -10px 0 #ff80ab;
    animation: floatFlower 4s ease-in-out infinite alternate;
    opacity: 0.8;
  }
  .flower1 { left: 10%; top: 40%; animation-delay: 0s;}
  .flower2 { left: 85%; top: 30%; animation-delay: 1.5s;}
  .flower3 { left: 40%; top: 80%; animation-delay: 3s;}

  @keyframes floatFlower {
    0% { transform: translateY(0);}
    100% { transform: translateY(-15px);}
  }

  /* Snake */
  .snake {
    position: fixed;
    bottom: 30px;
    right: 20px;
    width: 150px;
    height: 50px;
    background: pink;
    border-radius: 50% / 100%;
    box-shadow: inset 0 0 12px #d81b60;
    animation: snakeMove 3s ease-in-out infinite alternate;
  }

  @keyframes snakeMove {
    0% { transform: translateX(0) rotate(0deg);}
    50% { transform: translateX(-20px) rotate(-10deg);}
    100% { transform: translateX(0) rotate(0deg);}
  }

  /* Jewelry (Jori) */
  .jewelry {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 50px;
    border-bottom: 4px solid #d81b60;
    box-shadow: 0 4px 8px #d81b60;
    animation: swingJori 3s ease-in-out infinite alternate;
  }

  @keyframes swingJori {
    0% { transform: translateX(-50%) rotate(5deg);}
    100% { transform: translateX(-50%) rotate(-5deg);}
  }

  /* Wish text */
  #wish {
    margin: 40px auto;
    font-size: 1.5rem;
    color: #a32a53;
    max-width: 600px;
  }

</style>
</head>
<body>

  <h1>Happy Birthday Amira Zainab</h1>
  <button id="surpriseBtn">Click on your surprise</button>

  <div id="surprise">
    <!-- Cake -->
    <div class="cake" id="cake">
      <div class="candle">
        <div class="flame"></div>
      </div>
    </div>

    <!-- Balloons -->
    <div class="balloon" style="left:20%; animation-delay:0s;"></div>
    <div class="balloon" style="left:35%; animation-delay:1.5s;"></div>
    <div class="balloon" style="left:50%; animation-delay:3s;"></div>
    <div class="balloon" style="left:65%; animation-delay:4.5s;"></div>
    <div class="balloon" style="left:80%; animation-delay:6s;"></div>

    <!-- Flowers -->
    <div class="flower flower1"></div>
    <div class="flower flower2"></div>
    <div class="flower flower3"></div>

    <!-- Snake -->
    <div class="snake"></div>

    <!-- Jewelry -->
    <div class="jewelry"></div>
  </div>

  <div id="wish">
    ✨ On your special day, may happiness wrap you like a shawl and joy fill every corner of your heart. Happy Birthday, Amira! 💖
  </div>

  <audio id="bdayMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/22/audio_c1521c0e3f.mp3?filename=happy-birthday-29604.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

<script>
  const surpriseBtn = document.getElementById('surpriseBtn');
  const cake = document.getElementById('cake');
  const music = document.getElementById('bdayMusic');

  surpriseBtn.addEventListener('click', () => {
    cake.classList.add('show');
    music.play();
  });
</script>

</body>
</html>
